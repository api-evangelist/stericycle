vocabulary:
  name: Stericycle Vocabulary
  description: >-
    Domain vocabulary for Stericycle (now WM Healthcare Solutions), covering
    regulated medical waste management, compliance, healthcare safety,
    environmental regulations, and information destruction concepts.
  version: '1.0'
  created: '2026-05-02'
  modified: '2026-05-02'

terms:
  - term: Regulated Medical Waste (RMW)
    definition: >-
      Waste generated during medical, nursing, dental, pharmaceutical, or
      veterinary procedures that may be contaminated with blood, infectious
      materials, or pathogens and is subject to special handling and disposal
      regulations.
    category: Waste Classification

  - term: Sharps
    definition: >-
      Needles, syringes, lancets, scalpels, and other sharp medical devices
      that can puncture skin, posing infection risk and requiring special
      puncture-resistant containers for disposal.
    category: Waste Classification

  - term: Pharmaceutical Waste
    definition: >-
      Expired, unused, or contaminated medications and drugs that require
      specialized disposal, including controlled substances regulated by DEA
      and RCRA-hazardous pharmaceutical wastes.
    category: Waste Classification

  - term: Trace Chemotherapy Waste
    definition: >-
      Containers, IV bags, tubing, and personal protective equipment
      contaminated with small amounts of chemotherapy drugs; regulated
      separately from RCRA hazardous chemotherapy waste.
    category: Waste Classification

  - term: Pathological Waste
    definition: >-
      Human or animal tissues, organs, body parts, and body fluids removed
      during surgery, autopsy, or other medical procedures.
    category: Waste Classification

  - term: Manifest
    definition: >-
      A regulatory document (EPA Uniform Hazardous Waste Manifest) that tracks
      hazardous and regulated waste from the point of generation through
      transportation to final treatment and disposal.
    category: Compliance

  - term: Treatment, Storage, and Disposal Facility (TSDF)
    definition: >-
      A facility permitted under RCRA to treat, store, or dispose of
      hazardous waste where Stericycle delivers collected medical waste
      for final processing.
    category: Compliance

  - term: HIPAA
    definition: >-
      Health Insurance Portability and Accountability Act — federal law
      requiring protection of patient health information and safe disposal
      of documents and devices containing PHI.
    category: Regulation

  - term: OSHA Bloodborne Pathogen Standard
    definition: >-
      29 CFR 1910.1030 — OSHA regulation requiring healthcare employers to
      protect workers from exposure to bloodborne pathogens through training,
      PPE, and safe sharps disposal practices.
    category: Regulation

  - term: RCRA
    definition: >-
      Resource Conservation and Recovery Act — EPA law governing solid and
      hazardous waste management, including certain pharmaceutical and
      chemotherapy wastes generated by healthcare facilities.
    category: Regulation

  - term: DEA 41 Form
    definition: >-
      DEA Form 41 (Registrant Record of Controlled Substances Destroyed) used
      to document the destruction of unused controlled substance medications.
    category: Compliance

  - term: MyStericycle
    definition: >-
      Stericycle's online customer portal providing 24/7 account management,
      pickup scheduling, compliance training, reporting, and billing access.
    category: Platform

  - term: Steri-Safe
    definition: >-
      Stericycle's comprehensive compliance program combining waste disposal
      services with online training, safety plans, and regulatory guidance
      for healthcare organizations.
    category: Platform

  - term: Shred-it
    definition: >-
      Stericycle's secure information destruction service (acquired 2015)
      providing on-site and off-site document shredding and hard drive
      destruction for HIPAA and data privacy compliance.
    category: Services

  - term: Integrated Waste Stream Solutions (IWSS)
    definition: >-
      Stericycle's consolidated service model managing multiple regulated waste
      streams (medical, pharmaceutical, sharps, hazardous) under a single
      service agreement for large healthcare enterprises.
    category: Services

  - term: WM Healthcare Solutions
    definition: >-
      The division of Waste Management (WM) that operates Stericycle's
      regulated medical waste and compliance businesses following the 2024 acquisition.
    category: Corporate

categories:
  - Waste Classification
  - Compliance
  - Regulation
  - Platform
  - Services
  - Corporate
