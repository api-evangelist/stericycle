notes: 'Reconciliation marked false: Stericycle does not publish a public API pricing or developer plans
  page. The site is access-restricted (HTTP 403 for automated fetch) and commercial terms are negotiated
  per customer. Any rate or quota numbers in the prior scaffold were placeholders, not provider-published
  values.'
