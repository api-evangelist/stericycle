description: Stericycle is an enterprise B2B regulated-medical-waste, document-destruction, and compliance
  services provider. Public pricing is not published; service contracts are quoted by sales based on
  service mix, location footprint, pickup frequency, and waste volume. Any API integrations (customer
  portal, manifests, invoicing) are bundled with the underlying service contract rather than sold standalone.
sources:
